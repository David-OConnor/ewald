[package]
name = "ewald"
version = "0.1.15"
edition = "2024"
authors = ["David O'Connor <the_alchemist@fastmail.com>"]
description = "Ewald SPME force calculations"
keywords = ["n-body", "biology", "chemistry", "barnes", "dynamics"]
categories = [
    "algorithms",
    "mathematics",
    "science::computational-biology::structural-modeling",
    "science::computational-chemistry::cheminformatics",
    "science::computational-chemistry::molecular-simulation",
]
repository = "https://github.com/David-OConnor/ewald"
documentation = "https://docs.rs/ewald"
readme = "README.md"
license = "MIT"
exclude = [".gitignore"]


[dependencies]
lin_alg = "1.4.3"
# We use this to get the erf error function for use in the Ewald approximation in MD
# todo: Way to avoid this dep for something lighter?
statrs = "0.18.0"

# `realfft` is an augmentation that allows for R2C and C2R functionality.
rustfft = "6.4.1"
realfft = "3.5.0"

rayon = "1.11.0"  # Parallel execution on CPU using thread pools.

# `dynamic-loading` (rather than `dynamic-linking`) is deliberate: it makes the CUDA driver library
# a `dlopen`/`LoadLibrary` lookup at first use instead of a load-time dependency of the executable.
# A binary built with the `cuda` feature therefore still starts on machines with no NVIDIA driver;
# callers check `cudarc::driver::sys::is_culib_present()` and fall back to the CPU path.
# Note that cudarc's build script rejects `dynamic-loading` and `dynamic-linking` being active at
# once, and Cargo unions features across crates: every crate in the tree that depends on cudarc
# (here, `dynamics`, `molchanica`) must agree on this.
cudarc = { version = "0.19.8", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"], optional=true }

[build-dependencies]
cuda_setup = { version = "0.1.9", optional = true }
cc = "1.2.47"


[features]
cuda = ["cuda_setup", "cudarc", "lin_alg/cuda"]
cufft = ["cuda"]
vkfft = ["cuda"]
